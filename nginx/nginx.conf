limit_req_zone $binary_remote_addr zone=api_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name hemolyzis.ru www.hemolyzis.ru;

    location ~* ^/(\.|admin|wp|php) {
        access_log /var/log/nginx/blocked.log combined;
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hemolyzis.ru www.hemolyzis.ru;

    # SSL
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (один год, включая поддомены)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Статика фронтенда
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(admin|wp|php) {
        access_log /var/log/nginx/blocked.log combined;
        return 404;
    }

    # API прокси
    location /api/ {
        limit_req zone=api_req burst=20 nodelay;
        limit_conn api_conn 10;

        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location /test {
        default_type text/plain;
        return 200 "Hello from hemolyzis.ru HTTPS!\n";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}