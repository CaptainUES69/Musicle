<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz YaM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран выбора исполнителя -->
<section id="artistScreen" class="artist-screen">
    <div class="artist-container">
        <h1>Yandex Music Quiz</h1>
        <p>Введите имя исполнителя:</p>
        
        <div class="artist-input-container">
            <input type="text" id="artistInput" placeholder="Например, The Beatles" class="artist-input">
            <button onclick="selectArtist()" class="artist-button">Далее</button>
        </div>
        
        <div id="artistMessage" class="artist-message"></div>
    </div>
</section>

<!-- Экран выбора сложности -->
<section id="difficultyScreen" class="difficulty-screen" style="display: none;">
        <div class="difficulty-container">
            <h1>Yandex Music Quiz</h1>
            <p>Выберите уровень сложности:</p>
            
            <div class="difficulty-options">
                <button class="difficulty-btn" onclick="startQuiz('easy')">
                    <span class="difficulty-name">Легкий</span>
                    <span class="difficulty-desc">Отрезок 10 секунд</span>
                </button>
                
                <button class="difficulty-btn" onclick="startQuiz('medium')">
                    <span class="difficulty-name">Средний</span>
                    <span class="difficulty-desc">Отрезок 6 секунд</span>
                </button>
                
               <button class="difficulty-btn" onclick="startQuiz('hard')">
                <span class="difficulty-name">Сложный</span>
                <span class="difficulty-desc">Отрезок 2 секунды</span>
            </button>
        </div>
        
        <!-- Кнопка возврата к выбору исполнителя -->
        <button class="back-button" onclick="backToArtist()">← Назад к выбору исполнителя</button>
        
    </div>

    
</section>
<!-- Финальный экран -->
<section id="resultScreen" class="result-screen" style="display: none;">
    <div class="result-container">
        <h1>🎉 Квиз завершён! 🎉</h1>
        <div class="result-stats">
            <div class="result-item">
                <span class="result-label">🏆 Ваш счёт:</span>
                <span id="finalScore" class="result-value">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">⚡ Сложность:</span>
                <span id="finalDifficulty" class="result-value"></span>
            </div>
            <div class="result-item">
                <span class="result-label">🎵 Исполнитель:</span>
                <span id="finalArtist" class="result-value"></span>
            </div>
            <!-- При желании добавьте общее время (если считаете) -->
        </div>
        <button class="restart-button" onclick="restartFromResult()">Играть снова</button>
        <button class="back-to-artist-button" onclick="backToArtistFromResult()">Выбрать другого исполнителя</button>
        <div class="result-buttons">
        <button class="share-button" onclick="openShareModal()">📤 Поделиться результатом</button>
        <button class="leaderboard-button" onclick="showLeaderboard()">🏆 Таблица лидеров</button>
    </div>
    </div>

</section>

    <!-- Основной интерфейс квиза (изначально скрыт) -->
    <section id="quizScreen" class="audio-player" style="display: none;">

            <!-- Заголовок -->
    <div class="quiz-title">
        YAMQUIZ
    </div>

    <div class="difficulty-info">
        Уровень сложности: <span id="selectedDifficultyDisplay">Не выбран</span>
    </div>
        
        <!-- Сам аудиофайл (остается невидимым) -->
        <audio id="myAudio">
            <!-- Источник теперь будет меняться через JavaScript -->
        </audio>

        <!-- Индикатор загрузки -->
        <div id="loadingIndicator" class="loading-indicator hidden">
            <div class="spinner"></div>
        </div>
        
        <!-- Кнопки управления -->
        <div class="audio-controls">
            <button onclick="playAudio()">Старт</button>
            <button onclick="skipTrack()">Пропустить</button>
            <button onclick="restartAudio()">С начала</button>
        </div>  
        
        <!-- Полоса прогресса -->
        <div class="audio-progress">
            <progress id="audioProgress" value="0" max="100"></progress>
        </div>

        <!-- таймер и счетчик -->
        <div class="quiz-stats">
            <div class="timer-display">
                Время: <span id="timerValue">0.0</span> сек
            </div>
            <div class="score-display">
        🏆 Счёт: <span id="scoreValue">0</span>
            </div>
        </div>

        <!-- Поле для ввода кода перехода -->
        <div class="answer-input">
            <input type="text" id="answer" placeholder="Введите название трека...">
            <span id="answerMessage"></span>
        </div>

        <button class="answer-button" onclick="checkAnswer()">Проверить ответ</button>

        <!-- Регулятор громкости -->
        <div class="volume-control">
            <label for="volumeSlider">Громкость:</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
            <span id="volumeValue">100%</span>
        </div>
    </section>

<!-- Модальное окно для ввода псевдонима -->
<div id="shareModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="closeShareModal()">&times;</span>
        <h2>Введите ваш псевдоним</h2>
        <input type="text" id="playerAlias" maxlength="4" placeholder="4 символа" class="alias-input">
        <div id="aliasError" class="error-message" style="display: none;">Только буквы и цифры, 4 символа</div>
        <button class="modal-submit" onclick="submitScore()">Отправить</button>
    </div>
</div>

<!-- Модальное окно для таблицы лидеров -->
<div id="leaderboardModal" class="modal" style="display: none;">
    <div class="modal-content leaderboard-content">
        <span class="close" onclick="closeLeaderboardModal()">&times;</span>
        <h2>Топ-10 игроков</h2>
        <div id="leaderboardList" class="leaderboard-list">
            <!-- Здесь будет таблица -->
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
